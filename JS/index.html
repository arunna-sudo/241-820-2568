<button onclick="summitHobby()">Submit</button>

<script>
    function summitHobby() {
    let hobbies = document.querySelectorAll('input[name="hobby"]');
    let contenthtml = '<ul>';

    for (let i = 0; i < hobbies.length; i++) {
        if (hobbies[i].checked) {
            contenthtml += '<li>' + hobbies[i].value + '</li>';
            console.log(hobbies[i].value);
        }
    }
    contenthtml += '</ul>';

    let contenDiv = document.getElementById("content");
    contenDiv.innerHTML = contenthtml;
    }
</script>
